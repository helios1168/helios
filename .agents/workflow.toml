# helios's own project facts (SPEC §5). Template with every key: templates/workflow.toml.

[project]
test = "uv run pytest -q"
units = "docs/units"
always_allowed = ["tests/"]

[agents]
orchestrate = "claude"
implement = "opencode"
model = "claude"
verify_code = "claude"
verify_math = "other"

[harness.opencode]
model = "opencode/muse-spark-1.3-contributor-free"
server_url = "http://127.0.0.1:4096"
timeout_s = 3600

[control]
default = "manual"

[memory]
backend = "beads"
