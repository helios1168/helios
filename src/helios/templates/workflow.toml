# .agents/workflow.toml: every project fact helios needs (SPEC §5).
# Every key is optional; the value shown is the default. Unknown keys are an error.

[project]
test = "uv run pytest -q"          # run with bash -c from the worktree root
typecheck = ""                     # empty disables
units = "docs/units"
verify_artifacts = "tools/verify"
experiments = "experiments"
worktrees = ".claude/worktrees"
runs = ".helios/runs"
link_into_worktrees = []           # hub-relative globs symlinked into each new worktree
confidential = []                  # globs never staged, pushed or printed
always_allowed = ["tests/"]        # prefixes any impl bead may touch
# program = "pkg.model.program"    # module exposing REGISTRY (SPEC §15)
# claims = "pkg.model.claims"      # module with @claim functions
# [[project.check]] replaces test/typecheck with an ordered list of named
# checks: entry order is run order, "when" is "run", "merge" or "both" and
# defaults to "both". Setting test or typecheck together with any
# [[project.check]] entry is refused. An entry must come after every plain
# [project] key above, since it opens a new array-of-tables.
# [[project.check]]
# name = "lint"
# command = "ruff check"
# when = "run"

[agents]                           # agent spec: "harness", "harness:profile" or "other"
orchestrate = "claude"
implement = "codex"
model = "claude"
verify_code = "other"
verify_math = "other"
verify_validate = "other"
verify_order = ["claude", "codex", "opencode", "agy"]

[harness.claude]
# binary = "claude"
# model = "opus"
# effort = "high"
# timeout_s = 3600
# extra_args = []

[harness.codex]

[harness.opencode]
# server_url = "http://127.0.0.1:4096"

[harness.agy]

# A hub declares its own stages instead of the shipped research set of ten with one or more
# [[stage]] entries (SPEC §3.1); declaring any of them replaces all ten, and control.until and
# control.stop_at below then default to "" and [] rather than the research values shown. id,
# author and requires are the fields most stages need; gate, ownership, verifies and scaffold
# keep the defaults shown here unless a stage's role in the hub's own workflow differs.
# [[stage]]
# id = "impl"                        # becomes the bead's kind, its kind:<id> label, and
#                                     # skills/<id>/SKILL.md
# author = "implement"               # a key of [agents], or "other" for not-the-author
# requires = ["files", "test"]       # any of files, test, unit, parent, model
# gate = "report"                    # report | verdict | none
# ownership = "files"                # files | artifacts | none
# verifies = "model"                 # the stage this stage checks; absent otherwise
# scaffold = true                    # whether `helios unit new` offers this stage

[control]
default = "manual"                 # manual | until | auto
until = "verify-code"
stop_at = ["frame", "model", "report"]
confirm = ["merge"]

[memory]
backend = "beads"                  # beads | files
export_dir = ".helios/memories"
inject_cap_bytes = 32000

[telemetry]                        # export OpenTelemetry spans to an OTLP backend (SPEC §21)
enabled = false
endpoint = ""                      # full OTLP traces URL, e.g. https://cloud.langfuse.com/api/public/otel/v1/traces
timeout_s = 5
service_name = "helios"
# Credentials (LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY) come from the environment only,
# never from this file, because this file is committed to the repository.

[tolerance]
# tier1 = 1e-8
# tier2 = 5e-3
